<!DOCTYPE html>
<!--
    Šablona náhledového obrázku pro /web/ (src/images/og-web.png). Po úpravě přegeneruj v PowerShellu:
    & "C:\Program Files\Google\Chrome\Application\chrome.exe" --headless=new --hide-scrollbars --window-size=1200,630 --screenshot="$PWD\src\images\og-web.png" "$PWD\scripts\og-web.html"
-->
<html lang="cs">
<head>
<meta charset="UTF-8">
<style>
    html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
    body {
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        box-sizing: border-box;
        padding: 72px 80px;
        font-family: "Segoe UI", system-ui, sans-serif;
        color: #f5f5f4;
        background:
            radial-gradient(circle at 85% 15%, rgb(192 38 211 / .45), transparent 45%),
            radial-gradient(circle at 10% 100%, rgb(124 58 237 / .5), transparent 50%),
            #0c0a09;
    }
    .pill {
        align-self: flex-start;
        padding: 10px 24px;
        font-size: 26px;
        font-weight: 600;
        background: linear-gradient(135deg, #7c3aed, #c026d3);
        border-radius: 999px;
    }
    h1 { margin: 0; font-size: 84px; line-height: 1.05; letter-spacing: -.03em; font-weight: 800; }
    h1 span { color: #c4b5fd; }
    .foot { display: flex; justify-content: space-between; align-items: baseline; font-size: 30px; color: #a8a29e; }
    .foot strong { font-size: 44px; color: #f5f5f4; }
</style>
</head>
<body>
    <div class="pill">Jednoduché weby</div>
    <h1>Web, který prostě<br><span>funguje.</span></h1>
    <div class="foot">
        <span>gilich.cz/web</span>
        <span>od <strong>6 499 Kč</strong></span>
    </div>
</body>
</html>
